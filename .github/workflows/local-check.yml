---
name: local-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: local-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: yaml · shell · format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install yamllint
        run: pip install --no-cache-dir yamllint==1.35.1

      - name: yamllint
        run: yamllint -c .yamllint.yml .

      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: scripts
          additional_files: seed/apply-seed.sh
          severity: warning

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: prettier --check
        run: npx --yes prettier@3 --check '**/*.{md,yml,yaml,json}' --ignore-path .prettierignore

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate the prod stack
        working-directory: prod
        env:
          # The prod compose refuses to render without explicit image tags; these
          # placeholders only prove the file parses.
          API_IMAGE_TAG: v0.0.0
          FRONT_IMAGE_TAG: v0.0.0
        run: |
          set -euo pipefail
          docker compose -f docker-compose.prod.yml --env-file .env.prod.example config >/dev/null
          echo "prod stack OK"
          for overlay in docker-compose.monitoring.yml docker-compose.crowdsec.yml; do
            docker compose -f docker-compose.prod.yml -f "$overlay" \
              --env-file .env.prod.example config >/dev/null
            echo "$overlay OK"
          done

      - name: Validate the local stack
        working-directory: local
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml --env-file .env.example config >/dev/null
          echo "local stack OK"

  ansible-lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ansible/ansible-lint@262624cd0ab22a4221293216856c59671ce7aa5e # v26.6.0
        with:
          working_directory: prod/ansible

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: gitleaks detect
        # The gitleaks marketplace action requires a paid licence for org-owned
        # repos; the upstream binary is Apache-2.0 and has no such restriction.
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --redact --verbose --exit-code 1

      - name: Refuse plaintext in the SOPS-encrypted secrets
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in prod/secrets/prod.env.sops secrets/*.sops.yaml; do
            [ -e "$f" ] || continue
            if ! grep -q 'sops_' "$f"; then
              echo "::error file=$f::$f is not SOPS-encrypted — it must never be committed in clear."
              exit 1
            fi
            echo "$f is encrypted"
          done

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.7
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color
