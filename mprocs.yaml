procs:
  infra:
    cwd: local
    shell: docker compose up

  # Spring Boot API (port 8080). Sources .env puis .env.local (mêmes règles que le Makefile du
  # backend : .env.local surcharge — c'est là que vivent les vraies valeurs locales, dont
  # FLYWAY_LOCATIONS=…,classpath:db/seed) → Flyway applique le schéma + le seed de démo au démarrage.
  backend:
    cwd: ../Lumiris-Backend
    shell: "set -a; [ -f .env ] && . ./.env; [ -f .env.local ] && . ./.env.local; set +a; exec ./mvnw spring-boot:run"

  # Fronts WEB uniquement : site (3000) · admin (3001) · client (3003).
  # Le mobile est exclu ici — il tourne en desktop natif dans le proc `mobile` ci-dessous.
  front:
    cwd: ../Lumiris-Front
    shell: "bunx turbo run dev --parallel --filter='!@lumiris/mobile'"

  # Mobile = app DESKTOP Tauri (fenêtre native). Tauri lance Vite en interne sur :1420
  # (beforeDevCommand). `env -u LD_LIBRARY_PATH …` évite le conflit de lib snap au lancement
  # de la fenêtre GTK/WebKit depuis un shell snap (inoffensif sinon).
  mobile:
    cwd: ../Lumiris-Front/apps/mobile
    shell: "env -u LD_LIBRARY_PATH -u GTK_PATH -u GIO_MODULE_DIR bunx @tauri-apps/cli@latest dev"

  stripe:
    cwd: ../Lumiris-Backend
    shell: 'set -a; [ -f .env ] && . ./.env; [ -f .env.local ] && . ./.env.local; set +a; command -v stripe >/dev/null 2>&1 || { echo ''[stripe] CLI non installé — https://docs.stripe.com/stripe-cli''; exec sleep infinity; }; [ -n "$STRIPE_SECRET_KEY" ] || { echo ''[stripe] STRIPE_SECRET_KEY absent du .env''; exec sleep infinity; }; exec stripe listen --api-key "$STRIPE_SECRET_KEY" --forward-to localhost:8080/api/stripe/webhook'
