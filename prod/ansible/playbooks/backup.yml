---
# Local Postgres backup (gzipped dump, kept N days) under /srv/lumiris/backups.
# Run as juba:  ansible-playbook playbooks/backup.yml
- name: Lumiris prod — backup
  hosts: lumiris_prod
  become: false
  gather_facts: true
  tags: [backup]
  vars:
    backup_dir: /srv/lumiris/backups
    backup_keep_days: 14
  tasks:
    - name: Ensure backups directory exists
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: "0750"

    - name: pg_dump from the postgres container → gzip
      ansible.builtin.shell:
        cmd: >-
          docker exec lumiris-postgres sh -c 'pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"'
          | gzip > {{ backup_dir }}/lumiris-{{ ansible_date_time.iso8601_basic_short }}.sql.gz
      register: dump_result
      changed_when: dump_result.rc == 0

    - name: Prune dumps older than {{ backup_keep_days }} days
      ansible.builtin.find:
        paths: "{{ backup_dir }}"
        age: "{{ backup_keep_days }}d"
        patterns: "lumiris-*.sql.gz"
      register: stale_dumps

    - name: Remove pruned dumps
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ stale_dumps.files }}"
      loop_control:
        label: "{{ item.path }}"
