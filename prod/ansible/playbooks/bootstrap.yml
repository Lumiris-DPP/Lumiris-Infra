---
# First-boot server setup: hardening (swap/fail2ban/ufw/unattended) + Docker.
# Run once as juba (passwordless sudo):  ansible-playbook playbooks/bootstrap.yml
- name: Lumiris prod — bootstrap (hardening + Docker)
  hosts: lumiris_prod
  become: true
  gather_facts: true
  tags: [bootstrap]
  roles:
    - {role: common, tags: [common]}
    - {role: docker, tags: [docker]}
