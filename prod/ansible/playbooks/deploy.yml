---
# Deploy / update the app: sync repos → decrypt secrets → docker compose build + up.
# Runs as juba directly (juba is in the docker + lumiris groups, no sudo needed):
#   ansible-playbook playbooks/deploy.yml
- name: Lumiris prod — deploy
  hosts: lumiris_prod
  become: false
  gather_facts: false
  tags: [deploy]
  roles:
    - {role: app, tags: [app]}
