---
# Re-decrypt secrets (from SOPS) and restart the stack with the fresh env.
#   ansible-playbook playbooks/rotate-secrets.yml
- name: Lumiris prod — rotate secrets
  hosts: lumiris_prod
  become: false
  gather_facts: false
  tags: [rotate-secrets]
  roles:
    - role: app
      vars:
        app_force_recreate: true
