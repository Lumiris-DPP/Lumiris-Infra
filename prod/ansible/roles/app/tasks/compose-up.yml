---
- name: Pull the pinned images
  ansible.builtin.command:
    cmd: >-
      docker compose --env-file {{ app_env_file }} --env-file {{ app_images_env_file }}
      -f {{ app_compose_file }} pull
    chdir: "{{ app_compose_dir }}"
  register: pull_result
  changed_when: "'Pulled' in pull_result.stderr"

- name: Start the stack
  ansible.builtin.command:
    cmd: >-
      docker compose --env-file {{ app_env_file }} --env-file {{ app_images_env_file }}
      -f {{ app_compose_file }}
      up -d {{ '--force-recreate' if app_force_recreate | default(false) else '' }} --remove-orphans
    chdir: "{{ app_compose_dir }}"
  register: up_result
  changed_when: >-
    'Started' in up_result.stderr or 'Created' in up_result.stderr or 'Recreated' in up_result.stderr

- name: Wait for every application container to report healthy
  ansible.builtin.command:
    cmd: docker inspect --format={{ '{{' }}.State.Health.Status{{ '}}' }} {{ item }}
    chdir: "{{ app_compose_dir }}"
  loop: "{{ app_services }}"
  register: health_result
  until: health_result.stdout == "healthy"
  retries: "{{ app_health_retries }}"
  delay: "{{ app_health_delay }}"
  changed_when: false

- name: Collect the container status
  ansible.builtin.command:
    cmd: >-
      docker compose --env-file {{ app_env_file }} --env-file {{ app_images_env_file }}
      -f {{ app_compose_file }} ps
    chdir: "{{ app_compose_dir }}"
  register: ps_result
  changed_when: false

- name: Show the container status
  ansible.builtin.debug:
    var: ps_result.stdout_lines

- name: Prune images left behind by the previous release
  ansible.builtin.command:
    cmd: docker image prune --force --filter until=168h
  register: prune_result
  changed_when: "'Total reclaimed space: 0B' not in prune_result.stdout"
