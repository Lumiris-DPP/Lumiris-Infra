---
- name: Build images ONE service at a time (NEXT_PUBLIC_API_BASE_URL baked via build args)
  # Serialise explicitly: 3 concurrent Next builds OOM the 3.8 GB box, and
  # COMPOSE_PARALLEL_LIMIT does not gate buildkit/bake. One build per loop keeps
  # peak RSS to a single Next build (~1.5 GB).
  ansible.builtin.command:
    cmd: docker compose --env-file {{ app_env_file }} -f {{ app_compose_file }} build {{ item }}
    chdir: "{{ app_compose_dir }}"
  loop: "{{ app_services }}"
  register: build_result
  changed_when: true

- name: Start the stack
  ansible.builtin.command:
    cmd: >-
      docker compose --env-file {{ app_env_file }} -f {{ app_compose_file }}
      up -d {{ '--force-recreate' if app_force_recreate | default(false) else '' }} --remove-orphans
    chdir: "{{ app_compose_dir }}"
  register: up_result
  changed_when: >-
    'Started' in up_result.stderr or 'Created' in up_result.stderr or 'Recreated' in up_result.stderr

- name: Give containers time to become healthy
  ansible.builtin.pause:
    seconds: 30

- name: Collect container status
  ansible.builtin.command:
    cmd: docker compose --env-file {{ app_env_file }} -f {{ app_compose_file }} ps
    chdir: "{{ app_compose_dir }}"
  register: ps_result
  changed_when: false

- name: Show container status
  ansible.builtin.debug:
    var: ps_result.stdout_lines
