---
# Runs as juba (no become): juba is in the docker + lumiris groups and can write
# to /srv/lumiris and drive Docker directly.

- name: Sync repositories to the server (Docker build context)
  ansible.posix.synchronize:
    src: "{{ lumiris_src_root }}/{{ item }}/"
    dest: "{{ app_root }}/{{ item }}/"
    delete: true
    recursive: true
    rsync_opts:
      - "--exclude=.git"
      - "--exclude=node_modules"
      - "--exclude=.next"
      - "--exclude=.turbo"
      - "--exclude=target"
      - "--exclude=dist"
      - "--exclude=out"
      - "--exclude=*.log"
      - "--exclude=.env"
      - "--exclude=.env.prod"
  loop:
    - Lumiris-Front
    - Lumiris-Backend
    - Lumiris-Infra

- name: Render runtime env from the SOPS-encrypted secrets file
  ansible.builtin.copy:
    content: "{{ lookup('community.sops.sops', app_sops_env_file) }}"
    dest: "{{ app_env_file }}"
    mode: "0600"
  no_log: true

- name: Build + start the stack
  ansible.builtin.include_tasks: compose-up.yml
