# WAF overlay — CrowdSec IPS + Traefik bouncer plugin (file-provider variant).
# STAGED on purpose: enable only after the base stack is confirmed healthy.
#
# Adapted to the file-provider routing (the docker label provider is disabled —
# Docker 29 rejects Traefik's API 1.24). The bouncer middleware is defined in
# traefik-prod/dynamic-crowdsec/crowdsec.yml and applied via crowdsec@file on the
# websecure entrypoint (traefik.crowdsec.yml). CrowdSec reads Traefik's access
# logs over the docker socket (DOCKER_API_VERSION pinned so its docker client
# works on Docker 29).
#
# Enable:
#   grep '^CROWDSEC_BOUNCER_KEY=' .env.prod | cut -d= -f2- > crowdsec/lapi-key
#   docker compose --env-file .env.prod \
#     -f docker-compose.prod.yml -f docker-compose.crowdsec.yml up -d
#
# NOTE: not runtime-verified yet.

services:
  crowdsec:
    image: crowdsecurity/crowdsec:${CROWDSEC_VERSION:-v1.6.4}
    container_name: lumiris-crowdsec
    restart: unless-stopped
    environment:
      COLLECTIONS: "crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/base-http-scenarios"
      # Pre-registers a bouncer named "traefik" with this key (matches the plugin).
      BOUNCER_KEY_traefik: ${CROWDSEC_BOUNCER_KEY}
      # Docker 29's daemon min API is 1.40; CrowdSec's docker client honours this.
      DOCKER_API_VERSION: "1.44"
    volumes:
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - crowdsec_data:/var/lib/crowdsec/data
    networks: [lumiris_prod]
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 200M }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Swap Traefik to the plugin-enabled static config + mount the crowdsec@file
  # middleware and the LAPI key. `!override` replaces the base volume list (avoids
  # duplicate mount targets from list concatenation).
  traefik:
    volumes: !override
      - ./traefik-prod/traefik.crowdsec.yml:/etc/traefik/traefik.yml:ro
      - ./traefik-prod/dynamic:/etc/traefik/dynamic:ro
      - ./traefik-prod/dynamic-crowdsec/crowdsec.yml:/etc/traefik/dynamic/crowdsec.yml:ro
      - ./crowdsec/lapi-key:/etc/traefik/crowdsec/lapi-key:ro
      - traefik-acme:/letsencrypt
    depends_on:
      crowdsec:
        condition: service_healthy

volumes:
  crowdsec_data:
