# Monitoring overlay — Grafana Alloy agent that scrapes app + host metrics and
# remote_writes them to Grafana Cloud (free tier). Storage/dashboards live off-box.
#
# Enable alongside the base stack:
#   docker compose --env-file .env.prod \
#     -f docker-compose.prod.yml -f docker-compose.monitoring.yml up -d
#
# Needs GRAFANA_CLOUD_* in .env.prod (see .env.prod.example).

services:
  alloy:
    image: grafana/alloy:${ALLOY_VERSION:-v1.5.1}
    container_name: lumiris-alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=127.0.0.1:12345
    environment:
      GRAFANA_CLOUD_PROM_URL: ${GRAFANA_CLOUD_PROM_URL}
      GRAFANA_CLOUD_PROM_USER: ${GRAFANA_CLOUD_PROM_USER}
      GRAFANA_CLOUD_API_KEY: ${GRAFANA_CLOUD_API_KEY}
    volumes:
      - ./monitoring-prod/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - alloy_data:/var/lib/alloy/data
    networks: [lumiris_prod]
    deploy:
      resources:
        limits: {cpus: '0.5', memory: 200M}
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}

volumes:
  alloy_data:
