x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-restart: &restart
  restart: unless-stopped

services:
  # ── Edge / reverse proxy + TLS ──────────────────────────────────────────────
  traefik:
    image: traefik:${TRAEFIK_VERSION:-v3.5}
    container_name: lumiris-traefik
    <<: *restart
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8082:8082" # ping/health, localhost only
    volumes:
      # No docker.sock: routing is static (file provider), so traefik does not
      # need the daemon socket — smaller attack surface.
      - ./traefik-prod/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik-prod/dynamic:/etc/traefik/dynamic:ro
      - traefik-acme:/letsencrypt
    networks: [lumiris_prod]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 200M }
    logging: *default-logging

  # ── Datastores ──────────────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:${POSTGRES_VERSION:-17-3.5-alpine}
    container_name: lumiris-postgres
    <<: *restart
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lumiris}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [lumiris_prod] # no host port — internal only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-lumiris}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 400M }
    logging: *default-logging

  redis:
    image: redis:${REDIS_VERSION:-7.4-alpine}
    container_name: lumiris-redis
    <<: *restart
    command:
      ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    networks: [lumiris_prod] # internal only
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 96M }
    logging: *default-logging

  minio:
    image: quay.io/minio/minio:${MINIO_VERSION:-RELEASE.2024-11-07T00-52-20Z}
    container_name: lumiris-minio
    <<: *restart
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    # No host port: Traefik reaches :9000 over the internal network and publishes it
    # as minio.lumiris.eu. The console (:9001) stays unreachable from outside.
    networks: [lumiris_prod]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 300M }
    logging: *default-logging

  # ── Backend API ─────────────────────────────────────────────────────────────
  lumiris-api:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-lumiris-dpp}/lumiris-api:${API_IMAGE_TAG:?set API_IMAGE_TAG}
    container_name: lumiris-api
    <<: *restart
    networks: [lumiris_prod]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8080"
      # Cap the JVM so it can't starve postgres/minio/fronts on a 3.8 GB box.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65 -XX:InitialRAMPercentage=30 -XX:+UseG1GC"
      # Datastore
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lumiris}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS:-classpath:db/migration}
      # Redis (cache)
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Sentry (backend error monitoring)
      SENTRY_DSN: ${SENTRY_DSN_API:-}
      SENTRY_ENVIRONMENT: production
      # Auth + CORS
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      # Object storage (internal MinIO). The backend creates the bucket on startup
      # (MinioConfig), so no init job is needed. Uploads go over the internal network;
      # presigned URLs are signed with the public host, or browsers could not fetch them.
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-https://minio.lumiris.eu}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-lumiris-uploads}
      # Stripe
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_BOOTSTRAP_CATALOG: ${STRIPE_BOOTSTRAP_CATALOG:-true}
      STRIPE_PORTAL_RETURN_URL: ${STRIPE_PORTAL_RETURN_URL}
      STRIPE_PRODUCT_SOLO: ${STRIPE_PRODUCT_SOLO}
      STRIPE_PRODUCT_STUDIO: ${STRIPE_PRODUCT_STUDIO}
      STRIPE_PRODUCT_MAISON: ${STRIPE_PRODUCT_MAISON}
      STRIPE_PRODUCT_ATELIER_PLUS: ${STRIPE_PRODUCT_ATELIER_PLUS}
      STRIPE_PRODUCT_LOCAL: ${STRIPE_PRODUCT_LOCAL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      MAIL_FROM: ${MAIL_FROM}
      FRONTEND_URL: ${FRONTEND_URL}
      REPAIRER_APP_URL: ${REPAIRER_APP_URL}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      # Blockchain (optional; anchoring fails silently if unfunded)
      BLOCKCHAIN_RPC_URL: ${BLOCKCHAIN_RPC_URL}
      BLOCKCHAIN_WALLET_PRIVATE_KEY: ${BLOCKCHAIN_WALLET_PRIVATE_KEY}
      GEOCODING_USER_AGENT: ${GEOCODING_USER_AGENT:-lumiris-prod}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 1024M }
        reservations: { cpus: "0.25", memory: 256M }
    logging: *default-logging

  # ── Front-ends (Next.js standalone; API URL baked at build) ─────────────────
  lumiris-site:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-lumiris-dpp}/lumiris-site:${FRONT_IMAGE_TAG:?set FRONT_IMAGE_TAG}
    container_name: lumiris-site
    <<: *restart
    networks: [lumiris_prod]
    environment: { NODE_ENV: production, PORT: "3000" }
    depends_on: [lumiris-api]
    healthcheck:
      test:
        [
          "CMD",
          "/nodejs/bin/node",
          "-e",
          "fetch('http://localhost:3000/').then(()=>process.exit(0)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 320M }
    logging: *default-logging

  # The client app → app.lumiris.eu (renamed from the old `client.` subdomain)
  lumiris-app:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-lumiris-dpp}/lumiris-app:${FRONT_IMAGE_TAG:?set FRONT_IMAGE_TAG}
    container_name: lumiris-app
    <<: *restart
    networks: [lumiris_prod]
    environment: { NODE_ENV: production, PORT: "3003" }
    depends_on: [lumiris-api]
    healthcheck:
      test:
        [
          "CMD",
          "/nodejs/bin/node",
          "-e",
          "fetch('http://localhost:3003/').then(()=>process.exit(0)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 320M }
    logging: *default-logging

  lumiris-admin:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-lumiris-dpp}/lumiris-admin:${FRONT_IMAGE_TAG:?set FRONT_IMAGE_TAG}
    container_name: lumiris-admin
    <<: *restart
    networks: [lumiris_prod]
    environment: { NODE_ENV: production, PORT: "3001" }
    depends_on: [lumiris-api]
    healthcheck:
      test:
        [
          "CMD",
          "/nodejs/bin/node",
          "-e",
          "fetch('http://localhost:3001/').then(()=>process.exit(0)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 320M }
    logging: *default-logging

  lumiris-mobile:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-lumiris-dpp}/lumiris-mobile:${FRONT_IMAGE_TAG:?set FRONT_IMAGE_TAG}
    container_name: lumiris-mobile
    <<: *restart
    networks: [lumiris_prod]
    depends_on: [lumiris-api]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }
    logging: *default-logging

networks:
  lumiris_prod:
    name: lumiris_prod
    driver: bridge

volumes:
  traefik-acme:
  postgres_data:
  redis_data:
  minio_data:
