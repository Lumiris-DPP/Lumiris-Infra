# Lumiris prod Redis — reachable only on the internal docker network.
# Password is passed via --requirepass on the command line (from ${REDIS_PASSWORD}).

# Bind on all interfaces of the container; the container itself is not published
# to the host, so it stays private to the lumiris_prod network.
bind 0.0.0.0
protected-mode yes
port 6379

# Persistence: append-only file (durable) + periodic RDB snapshots.
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000

# Memory guardrails for a small box.
maxmemory 64mb
maxmemory-policy allkeys-lru

# Reduce blast radius: rename the most dangerous admin commands.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
