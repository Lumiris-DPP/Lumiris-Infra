---
# Traefik static config WITH the CrowdSec bouncer plugin enabled.
# Used only by the docker-compose.crowdsec.yml overlay (mounted over traefik.yml).
# Identical to traefik.yml except: the experimental plugin declaration and the
# `crowdsec@docker` middleware added to the websecure entrypoint (applies to ALL
# routers at once — no per-service label changes needed).

global:
  checkNewVersion: false
  sendAnonymousUsage: false

experimental:
  plugins:
    crowdsec:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.4.2

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
      middlewares:
        - security-headers@file
        - compress@file
        - crowdsec@docker
    http3: {}
  ping:
    address: ":8082"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: lumiris_prod
    watch: true
  file:
    directory: /etc/traefik/dynamic
    watch: true

api:
  dashboard: false
  insecure: false

ping:
  entryPoint: ping

log:
  level: INFO
  format: json

accessLog:
  format: json
  filters:
    statusCodes:
      - "400-599"
    retryAttempts: true
    minDuration: "10ms"

certificatesResolvers:
  letsencrypt:
    acme:
      email: ops@lumiris.eu
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web
