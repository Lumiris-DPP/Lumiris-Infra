---
# Traefik static config WITH the CrowdSec bouncer plugin — used ONLY by the
# docker-compose.crowdsec.yml overlay (mounted over traefik.yml).
# Same as traefik.yml (file-provider routing; the docker provider is disabled
# because Docker 29 rejects Traefik's API 1.24) PLUS:
#   - the experimental crowdsec plugin declaration
#   - `crowdsec@file` added to the websecure entrypoint (applies to all routers).
# The `crowdsec` middleware itself is defined in dynamic/crowdsec.yml, mounted by
# the overlay.

global:
  checkNewVersion: false
  sendAnonymousUsage: false

experimental:
  plugins:
    crowdsec:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.4.2

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
      middlewares:
        - security-headers@file
        - compress@file
        - crowdsec@file
    http3: {}
  ping:
    address: ":8082"

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

api:
  dashboard: false
  insecure: false

ping:
  entryPoint: ping

log:
  level: INFO
  format: json

accessLog:
  format: json
  filters:
    statusCodes:
      - "400-599"
    retryAttempts: true
    minDuration: "10ms"

certificatesResolvers:
  letsencrypt:
    acme:
      email: ops@lumiris.eu
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web
