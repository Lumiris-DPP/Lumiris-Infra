---
global:
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
      middlewares:
        - security-headers@file
        - compress@file
    http3: {}
  ping:
    # Internal health only — bound to 127.0.0.1 by the compose port mapping.
    address: ":8082"

providers:
  # Docker label provider intentionally disabled: Traefik's docker client defaults
  # to API 1.24, which the Docker 29 daemon rejects (min 1.40). Routing is defined
  # statically in dynamic/routes.yml (file provider) instead.
  file:
    directory: /etc/traefik/dynamic
    watch: true

api:
  dashboard: false
  insecure: false

ping:
  entryPoint: ping

log:
  level: INFO
  format: json

accessLog:
  format: json
  filters:
    statusCodes:
      - "400-599"
    retryAttempts: true
    minDuration: "10ms"

certificatesResolvers:
  letsencrypt:
    acme:
      # Static config is NOT env-interpolated by Traefik — keep this literal.
      email: ops@lumiris.eu
      # Must match the mounted volume `traefik-acme:/letsencrypt` (fixes the
      # previous mismatch that re-issued certs on every recreate).
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web
